name: Build PushComm Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-ptt/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android-ptt
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build smartphone debug APK
        run: bash ./gradlew :app:assembleSmartphoneDebug --no-daemon --stacktrace

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pushcomm-smartphone-debug-apk
          path: apps/android-ptt/app/build/outputs/apk/smartphone/debug/*.apk
          if-no-files-found: error
          retention-days: 14
